name: ignite-autodash
services:
  frontend:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./app/frontend_service/Dockerfile
  agent:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./app/Dockerfile.cpu
  ollama:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./app/ollama_service/Dockerfile
infra:
  provider: bicep
  path: infra
