name: ignite-autodash
services:
  frontend:
    project: .
    language: js
    host: containerapp
    docker:
      path: ./app/frontend-service/Dockerfile
      context: ./app/frontend-service
  agent:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./app/agent-service/Dockerfile
      context: ./app/agent-service
  ollama:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./app/ollama-service/Dockerfile
      context: ./app/ollama-service
infra:
  provider: bicep
  path: infra
