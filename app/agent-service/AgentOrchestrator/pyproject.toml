[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Microsoft Agent Framework orchestrator that chains the Ignite playground agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-azure-ai>=0.1.0a0",
    "azure-identity>=1.17",
    "azure-storage-blob>=12.19",
    "httpx>=0.27",
    "orjson>=3.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "jsonschema>=4.19",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "pandas>=2.2"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_orchestrator*"]
exclude = ["artifacts*", "tests*"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that exercise the full orchestrator happy path",
]
