[project]
name = "ollama-proxy-service"
version = "0.1.0"
description = "Structured JSON planner components reused by the agent orchestrator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<0.31",
    "httpx>=0.27,<0.28",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "jsonschema>=4.23,<5.0",
    "orjson>=3.10,<4.0",
    "structlog>=24.1,<25.0",
    "python-dotenv>=1.0,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_proxy_service*"]
